name: Feature request
description: Suggest a new skill, stack support, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? We'd love to hear it. The most impactful contributions are new skills or support for new languages/ecosystems.

  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New skill (add support for a library or framework)
        - New language ecosystem (new manifest parser)
        - New combo rule
        - CLI improvement
        - Other
    validations:
      required: true

  - type: input
    id: technology
    attributes:
      label: Technology or library name
      description: If requesting a new skill, which library?
      placeholder: "e.g. Hono, Bun, Gleam, Phoenix"

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap — what can't you do today?
      placeholder: "When working with Hono, there's no skill available so the agent doesn't know the routing conventions..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to contribute this?
      options:
        - label: Yes, I can open a PR for this
        - label: I can help review a PR
        - label: I'd just like to request it
